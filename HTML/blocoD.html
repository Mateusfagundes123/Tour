<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="../CSS/Style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

  <style>
    .container360 {
      max-width: 1000px;
      margin: 100px auto 50px auto;
      padding: 0 20px;
    }

    .view360 {
      margin-bottom: 50px;
      text-align: center;
    }

    .view360 iframe {
      width: 100%;
      height: 500px;
      border: none;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .view360 p {
      margin-top: 10px;
      font-weight: bold;
      color: #24551d;
    }

    footer {
      background-color: #24551d;
      color: white;
      text-align: center;
      padding: 15px;
    }
  </style>
   <script>
  document.addEventListener("DOMContentLoaded", function () {
    const btnMenu = document.getElementById("btn-menu");
    const menu = document.getElementById("menu");
    const fecharMenu = document.getElementById("fechar-menu");

    const btnBlocos = document.getElementById("btn-blocos");
    const submenuBlocos = document.getElementById("submenu-blocos");

    btnMenu.addEventListener("click", function (event) {
      event.preventDefault();
      menu.classList.add("open");
    });

    fecharMenu.addEventListener("click", function () {
      menu.classList.remove("open");
      submenuBlocos.classList.add("oculto"); // fecha o submenu ao fechar o menu principal
    });

    btnBlocos.addEventListener("click", function () {
      submenuBlocos.classList.toggle("oculto");
      btnBlocos.textContent = submenuBlocos.classList.contains("oculto") ? "Blocos ▾" : "Blocos ▴";
    });
  });
  </script>

<body>
<header class="barra">
  <div class="voltarbarra">
    <p>IFSC Chapecó</p>
  </div>
  <div class="hamburguerbarra">
    <p>Visite os blocos</p>

    </a>
  </div>
</header>

  <nav id="menu" class="menu-mobile">
    <button id="fechar-menu">✖</button>
    <ul>

  <li><a href="jogoDomesticos.html"><button class="categoriaJogo">Imagens</button></a></li>

  <!-- Item com submenu -->
  <li>
    <button class="categoriaJogo" id="btn-blocos">Blocos ▾</button>
    <ul id="submenu-blocos" class="submenu oculto">
      <li><a href="./blocoA.html"><button class="categoriaJogo">Bloco A</button></a></li>
      <li><a href="./blocoB.html"><button class="categoriaJogo">Bloco B</button></a></li>
      <li><a href="./blocoC.html"><button class="categoriaJogo">Bloco C</button></a></li>
      <li><a href="./blocoD.html"><button class="categoriaJogo">Bloco D</button></a></li>

      <li><a href="./blocoF.html"><button class="categoriaJogo">Bloco F</button></a></li>

    </ul>
  </li>
</ul>
</nav>
